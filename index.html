<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Physics Lab Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0f1a;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;padding:0.8rem;display:flex;justify-content:center;min-height:100vh}
        .container{max-width:600px;width:100%;background:#111827;border-radius:2rem;padding:1.2rem;border:2px solid #f5b81b}
        .header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f5b81b;padding-bottom:8px;margin-bottom:10px}
        .title-box{text-align:center;flex:1}
        .title-fixed{font-size:1.3rem;font-weight:800;color:#f5b81b}
        .title-dynamic{font-size:0.9rem;color:#fff;margin-top:2px}
        .icon-btn{width:44px;height:44px;background:#1e293b;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #334155;cursor:pointer;color:#f5b81b}
        .meta-row{display:flex;justify-content:space-between;background:#1e293b;padding:6px 14px;border-radius:30px;font-size:0.75rem;margin:6px 0;flex-wrap:wrap}
        .lang-id-row{display:flex;gap:6px;margin:8px 0}
        .lang-id-row select,.lang-id-row .id-box{flex:1;padding:6px 10px;background:#1e293b;border:1px solid #334155;border-radius:30px;font-size:0.75rem;color:#fff}
        .credit-section{background:#0f172a;border:2px solid #1e293b;border-radius:16px;padding:12px;margin:8px 0}
        .free-badge{font-weight:600;color:#f5b81b;text-align:center}
        .pack-btn{display:block;width:100%;background:#1e293b;border:1px solid #f5b81b;border-radius:30px;padding:8px;margin-bottom:6px;color:#fff;cursor:pointer}
        .code-row{display:flex;gap:6px;margin-top:6px}
        .code-row input{flex:1;padding:6px;background:#1e293b;border:1px solid #334155;border-radius:30px;color:#fff}
        .code-row button{background:#3b82f6;border:none;border-radius:30px;padding:6px 14px;color:#fff;cursor:pointer}
        #startBtn{width:100%;padding:16px;background:linear-gradient(135deg,#f5b81b,#e67e22);border:none;border-radius:40px;font-weight:800;color:#0a0f1a;font-size:1.1rem;cursor:pointer;margin:10px 0}
        #devices-screen{display:none;padding:10px}
        .device-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:10px}
        .device-btn{background:#1e293b;border:2px solid #334155;border-radius:16px;padding:15px 5px;text-align:center;cursor:pointer;min-width:0}
        .device-btn i{font-size:2rem;color:#f5b81b;display:block;margin-bottom:8px}
        .device-btn span{display:block;font-size:0.78rem;line-height:1.25;word-break:break-word;overflow-wrap:break-word;hyphens:auto}
        #labArea{display:none;margin-top:12px}
        .lab-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .back-btn{background:#f97316;border:none;border-radius:30px;padding:8px 16px;color:#fff;cursor:pointer;font-size:1rem;font-weight:bold}
        .current-device{font-weight:800;font-size:1.2rem;color:#f5b81b}
        .sensor-wrapper{display:flex;flex-direction:column;gap:15px}
        .sensor-block{background:#0f172a;border:2px solid #334155;border-radius:16px;padding:15px}
        .sensor-block.finished{border-color:#2ecc71}
        .sensor-block.skipped{border-color:#f59e0b}
        .sensor-title{font-weight:bold;color:#f5b81b;margin-bottom:10px}
        .sensor-instruction{font-size:0.75rem;color:#cbd5e1;background:#1e293b;padding:6px;border-radius:8px;margin-bottom:10px}
        .sensor-display{background:#000;border-radius:12px;min-height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
        .sensor-display video{width:100%;max-height:150px;border-radius:8px}
        .sensor-result{font-weight:bold;color:#2ecc71;text-align:center;margin-bottom:10px;min-height:24px}
        .action-btns{display:flex;gap:6px}
        .action-btns button{flex:1;padding:10px;border:none;border-radius:30px;font-weight:bold;cursor:pointer;font-size:0.7rem}
        .btn-blue{background:#3b82f6;color:#fff}.btn-gray{background:#6c7a92;color:#fff}
        .final-btn{width:100%;padding:16px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:40px;font-weight:800;color:#fff;font-size:1.1rem;cursor:pointer;margin-top:15px;display:block}
        .final-result{background:#064e3b;border:3px solid #2ecc71;border-radius:16px;padding:15px;margin-top:15px;display:none}
        .verdict-icon{font-size:3rem;text-align:center;margin-bottom:10px}
        .final-verdict-text{font-size:1.3rem;font-weight:800;text-align:center;padding:10px;color:#fff;line-height:1.6;margin-bottom:10px}
        .final-solution{font-size:0.85rem;text-align:center;color:#a7f3d0;line-height:1.6;margin-bottom:10px;padding:0 10px}
        .toolbar{display:flex;gap:8px;justify-content:center;margin:10px 0}
        .tool-btn{background:#1e293b;border:1px solid #334155;border-radius:30px;padding:6px 14px;color:#fff;cursor:pointer}
        .rating{text-align:center;font-size:0.75rem;color:#94a3b8;margin:8px 0}
        .stars{color:#f5b81b;font-size:1.1rem}
        .stars span{cursor:pointer}
        .admin-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:9999}
        .admin-modal.show{display:flex}
        .admin-box{background:#1e293b;padding:20px;border-radius:16px;text-align:center;width:90%;max-width:350px;border:2px solid #f5b81b}
        .admin-box input{width:100%;padding:10px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#fff;margin:10px 0;text-align:center}
        .admin-box button{width:100%;padding:10px;border:none;border-radius:30px;font-weight:bold;cursor:pointer;margin-top:5px}
        .btn-green{background:#10b981;color:#fff}
        .btn-red{background:#ef4444;color:#fff}
        
        .extra-back-btn{display:block;width:100%;padding:12px;background:#1e293b;color:#fff;border:2px solid #f5b81b;border-radius:30px;font-weight:bold;font-size:1rem;cursor:pointer;margin-top:10px;text-align:center}
        .extra-back-btn:hover{background:#f5b81b;color:#0a0f1a}
        .gas-safety-note{background:#7c2d12;border:2px solid #f97316;border-radius:12px;padding:10px;margin-bottom:10px;font-size:0.8rem;line-height:1.6;text-align:center;color:#fff}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon-btn" onclick="copyLink()"><i class="fas fa-qrcode"></i></div>
        <div class="title-box">
            <div class="title-fixed">Physics Lab Home</div>
            <div class="title-dynamic" id="titleDynamic"></div>
        </div>
        <div class="icon-btn" id="adminIcon"><i class="fas fa-user-shield"></i></div>
    </div>

    <div class="meta-row">
        <span>📍 <span id="locationDisplay">...</span></span>
        <span>🕐 <span id="timeDisplay">--:--:--</span></span>
        <span>📅 <span id="dateDisplay">--/--/----</span></span>
    </div>

    <div class="lang-id-row">
        <select id="langSelect"></select>
        <div class="id-box">🆔 <span id="deviceId">----</span></div>
    </div>

    <div class="credit-section">
        <div class="free-badge" id="freeBadge">🎁 <span id="freeLabel">مجانية</span>: <span id="freeCount">3</span>/3</div>
        <button class="pack-btn" onclick="buyPack(1)">💵 1 / $2</button>
        <button class="pack-btn" onclick="buyPack(5)">📦 5 / $8</button>
        <button class="pack-btn" onclick="buyPack(15)">🏆 15 / $20</button>
        <div class="code-row">
            <input type="text" id="codeInput" placeholder="🔑 كود التفعيل">
            <button id="btnActivate">تفعيل</button>
        </div>
    </div>

    <button id="startBtn" onclick="openDevicesScreen()">🚀 بدء التقييم الفيزيائي</button>

    <div id="devices-screen">
        <div style="text-align:center; font-weight:bold; margin-bottom:10px;" id="selectDeviceLabel"></div>
        <div class="device-grid">
            <div class="device-btn" onclick="openDevice('ثلاجة')"><i class="fas fa-thermometer-half"></i><span id="dev1">ثلاجة</span></div>
            <div class="device-btn" onclick="openDevice('غسالة')"><i class="fas fa-tshirt"></i><span id="dev2">غسالة</span></div>
            <div class="device-btn" onclick="openDevice('مكيف')"><i class="fas fa-wind"></i><span id="dev3">مكيف</span></div>
            <div class="device-btn" onclick="openDevice('سخان كهربائي')"><i class="fas fa-bolt"></i><span id="dev4">سخان كهربائي</span></div>
            <div class="device-btn" onclick="openDevice('سخان غاز')"><i class="fas fa-gas-pump"></i><span id="dev5">سخان غاز</span></div>
            <div class="device-btn" onclick="openDevice('بوتاجاز')"><i class="fas fa-fire"></i><span id="dev6">بوتاجاز</span></div>
        </div>
        <button class="back-btn" style="width:100%;margin-top:14px" id="btnBackToStart" onclick="backToStart()"></button>
    </div>

    <div id="labArea">
        <div class="lab-header">
            <button class="back-btn" id="btnBack" onclick="resetApp()">↩️ رجوع</button>
            <div class="current-device" id="currentDeviceLabel"></div>
        </div>

        <div class="sensor-wrapper">
            <div class="sensor-block" id="block-camera">
                <div class="sensor-title" id="sensorCameraTitle"></div>
                <div class="sensor-instruction" id="instrCamera"></div>
                <div class="sensor-display"><video id="video-preview" autoplay playsinline></video></div>
                <div class="sensor-result" id="result-camera"></div>
                <div class="action-btns">
                    <button class="btn-blue" onclick="measureCamera()" id="btnMeasureCam"></button>
                    <button class="btn-gray" onclick="skipSensor('camera')" id="btnSkipCam"></button>
                </div>
            </div>

            <div class="sensor-block" id="block-microphone">
                <div class="sensor-title" id="sensorMicTitle"></div>
                <div class="sensor-instruction" id="instrMic"></div>
                <div class="sensor-display"><span id="micText">...</span></div>
                <div class="sensor-result" id="result-microphone"></div>
                <div class="action-btns">
                    <button class="btn-blue" onclick="measureMicrophone()" id="btnMeasureMic"></button>
                    <button class="btn-gray" onclick="skipSensor('microphone')" id="btnSkipMic"></button>
                </div>
            </div>

            <div class="sensor-block" id="block-vibration">
                <div class="sensor-title" id="sensorVibTitle"></div>
                <div class="sensor-instruction" id="instrVib"></div>
                <div class="sensor-display"><span id="vibText">...</span></div>
                <div class="sensor-result" id="result-vibration"></div>
                <div class="action-btns">
                    <button class="btn-blue" onclick="measureVibration()" id="btnMeasureVib"></button>
                    <button class="btn-gray" onclick="skipSensor('vibration')" id="btnSkipVib"></button>
                </div>
            </div>
        </div>

        <button class="final-btn" onclick="showFinalResult()" id="btnFinal">🔬 عرض الخلاصة النهائية</button>

        <div class="final-result" id="finalResult">
            <h3 id="finalTitle">🧠 الخلاصة النهائية</h3>
            <div class="verdict-icon" id="verdictIcon">✅</div>
            <div class="final-verdict-text" id="finalText"></div>
            <div class="final-solution" id="finalSolution"></div>
            <div class="gas-safety-note" id="gasSafetyNote" style="display:none"></div>
            <div class="toolbar">
                <button class="tool-btn" onclick="speakFinal()" id="btnListen">🔊 استمع</button>
                <button class="tool-btn" onclick="copyFinal()" id="btnCopy">📋 نسخ</button>
                <button class="tool-btn" onclick="shareFinal()" id="btnShare">📤 مشاركة</button>
            </div>
            <button class="extra-back-btn" onclick="resetApp()">↩️ العودة من جديد لاختيار جهاز آخر</button>
        </div>
    </div>

    <div class="rating"><span id="ratingLabel">⭐ تقييمك:</span> <span class="stars" id="starsDisplay"><span onclick="rate(1)">★</span><span onclick="rate(2)">★</span><span onclick="rate(3)">★</span><span onclick="rate(4)">★</span><span onclick="rate(5)">★</span></span></div>
</div>

<!-- نافذة المطور -->
<div class="admin-modal" id="adminModal">
    <div class="admin-box">
        <h3 id="adminTitle">🔐 وضع المطور</h3>
        <input type="password" id="adminPwd" placeholder="كلمة المرور">
        <button class="btn-green" id="btnAdminConfirm">تأكيد</button>
        <button class="btn-red" id="btnAdminClose">إلغاء</button>
    </div>
</div>

function buildLangSelect() {
    const sel = document.getElementById('langSelect');
    sel.innerHTML = LANG_LIST.map(l => `<option value="${l.code}">${l.flag} ${l.name}</option>`).join('');
    sel.onchange = function() {
        currentLang = this.value;
        document.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        applyTranslations();
    };
}

function updateCreditsUI() {
    if (state.isAdmin) {
        document.getElementById('freeCount').textContent = "👑 " + t('unlimited');
    } else {
        document.getElementById('freeCount').textContent = state.freeCredits + state.paidCredits;
    }
}

// ============================================================
function consumeCredit() {
    if (state.isAdmin) return true;
    if (state.freeCredits > 0) { state.freeCredits--; updateCreditsUI(); saveCredits(); return true; }
    if (state.paidCredits > 0) { state.paidCredits--; updateCreditsUI(); saveCredits(); return true; }
    showToast('⚠️ ' + t('noCredit'));
    return false;
}

function saveCredits() {
    localStorage.setItem('freeCredits', state.freeCredits);
    localStorage.setItem('paidCredits', state.paidCredits);
}

// شاشة واحدة ظاهرة دائماً بمصدر حقيقة واحد بدل تفريق أسطر style.display
// على عدة دوال — وهو ما كان هشاً وقد يترك المستخدم عالقاً بين الشاشات.
const SCREENS = { start: 'startBtn', devices: 'devices-screen', lab: 'labArea' };
function showScreen(name) {
    Object.entries(SCREENS).forEach(([key, id]) => {
        document.getElementById(id).style.display = (key === name) ? 'block' : 'none';
    });
}

function openDevicesScreen() {
    if (!consumeCredit()) return;
    showScreen('devices');
}

function backToStart() {
    showScreen('start');
}

function openDevice(deviceId) {
    state.sensorResults = { camera: null, microphone: null, vibration: null };
    showScreen('lab');
    document.getElementById('currentDeviceLabel').textContent = getDeviceName(deviceId);
    document.getElementById('finalResult').style.display = 'none';
    document.getElementById('finalSolution').textContent = "";
    document.getElementById('gasSafetyNote').style.display = 'none';

    document.getElementById('result-camera').innerText = "";
    document.getElementById('result-microphone').innerText = "";
    document.getElementById('result-vibration').innerText = "";

// 6. الحساسات
// ============================================================
async function measureCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('video-preview');
        video.srcObject = stream; await video.play();
        const canvas = document.createElement('canvas'); canvas.width=320; canvas.height=240;
        const ctx = canvas.getContext('2d'); ctx.drawImage(video,0,0,320,240);
        const data = ctx.getImageData(0,0,320,240).data;
        let r=0,g=0,b=0; const num=data.length/4;
        for(let i=0;i<data.length;i+=4){ r+=data[i];g+=data[i+1];b+=data[i+2]; }
        r=Math.round(r/num);g=Math.round(g/num);b=Math.round(b/num);
        stream.getTracks().forEach(t=>t.stop());
        let imageState="none";
        if(r<60&&g<60&&b<60) imageState="black";
        else if(r>200&&g>200&&b>200) imageState="white";
        else if(r>150&&g<100) imageState="orange";
        else if(b>150&&r<100) imageState="blue";
        state.sensorResults.camera=imageState;
        document.getElementById('result-camera').innerHTML=`RGB: (${r}, ${g}, ${b})`;
        document.getElementById('block-camera').classList.add('finished');
        checkAllMeasured();
    } catch(e) {
        document.getElementById('result-camera').innerText=t('cameraDenied');
        document.getElementById('block-camera').classList.add('skipped');
        state.sensorResults.camera="none";
        checkAllMeasured();
    }
}

async function measureMicrophone() {
    try {
        document.getElementById('micText').textContent = "...";
        const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser(); analyser.fftSize=4096;
        source.connect(analyser);
        const bufferLength = analyser.frequencyBinCount;

        // القراءة اللحظية الواحدة كانت تُؤخذ قبل أن يعالج المحلّل أي صوت فعلياً، فتكون شبه عشوائية.
        // هنا نجمع عدة عيّنات على مدى ثانية واحدة فعلياً ونأخذ متوسطها لقياس حقيقي.
        const SAMPLES = 20, INTERVAL_MS = 50;
        const avgFreqData = new Float64Array(bufferLength);
        const tempData = new Uint8Array(bufferLength);
        for (let s = 0; s < SAMPLES; s++) {
            analyser.getByteFrequencyData(tempData);
            for (let i = 0; i < bufferLength; i++) avgFreqData[i] += tempData[i];
            await new Promise(r => setTimeout(r, INTERVAL_MS));
        }
        const freqData = avgFreqData.map(v => v / SAMPLES);

        let maxMag=0, domFreq=0, totalPower=0;
        for(let i=0;i<bufferLength;i++){ totalPower+=freqData[i]; if(freqData[i]>maxMag){maxMag=freqData[i];domFreq=(i*ctx.sampleRate)/analyser.fftSize;} }
        let entropy=0;
        for(let i=0;i<bufferLength;i++){ let p=freqData[i]/totalPower; if(p>0) entropy-=p*Math.log2(p); }
        entropy = totalPower>0 ? (entropy/Math.log2(bufferLength)).toFixed(2) : 0;
        stream.getTracks().forEach(t=>t.stop()); ctx.close();
        let soundState="none";
        if(totalPower===0) soundState="safe"; // لا صوت ملتقط = هدوء فعلي، وليس عطلاً
        else if(entropy>0.8&&domFreq>3000) soundState="danger";
        else if(entropy>0.7) soundState="warning";
        else if(domFreq<150) soundState="safe";
        else soundState="warning";
        state.sensorResults.microphone=soundState;
        document.getElementById('micText').textContent="Done";
        document.getElementById('result-microphone').innerHTML=`Freq: ${Math.round(domFreq)} Hz`;
        document.getElementById('block-microphone').classList.add('finished');
        checkAllMeasured();
    } catch(e) {
        document.getElementById('result-microphone').innerText=t('micDenied');
        document.getElementById('block-microphone').classList.add('skipped');
        state.sensorResults.microphone="none";
        checkAllMeasured();
    }
}

function measureVibration() {
    state.motionSamples=[]; let count=0;
    const handler=(e)=>{
        const acc=e.accelerationIncludingGravity;
        if(acc){ state.motionSamples.push(Math.sqrt(acc.x*acc.x+acc.y*acc.y+acc.z*acc.z)); count++; }
        if(count>=50){
            window.removeEventListener('devicemotion',handler);
            const mean=state.motionSamples.reduce((a,b)=>a+b,0)/state.motionSamples.length;
            const variance=state.motionSamples.reduce((a,b)=>a+Math.pow(b-mean,2),0)/state.motionSamples.length;
            const stdDev=Math.sqrt(variance);
            let vibState="none";
            if(stdDev<0.2) vibState="safe";
            else if(stdDev>0.8) vibState="danger";
            else vibState="warning";
            state.sensorResults.vibration=vibState;
            document.getElementById('vibText').textContent="Done";
            document.getElementById('result-vibration').innerHTML=`RMS: ${mean.toFixed(2)}`;
            document.getElementById('block-vibration').classList.add('finished');
            checkAllMeasured();
        }
    };
    
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
            .then(result => {
                if (result === 'granted') {
                    window.addEventListener('devicemotion', handler);
                } else {
                    document.getElementById('result-vibration').innerText = t('vibDenied');
                    state.sensorResults.vibration = "none";
                    document.getElementById('block-vibration').classList.add('skipped');
                    checkAllMeasured();
                }
            })
            .catch(() => {
                document.getElementById('result-vibration').innerText = t('vibDenied');
                state.sensorResults.vibration = "none";
                document.getElementById('block-vibration').classList.add('skipped');
                checkAllMeasured();
            });
    } else {
        window.addEventListener('devicemotion', handler);
    }
    
    setTimeout(()=>{ 
        window.removeEventListener('devicemotion',handler); 
        if(state.motionSamples.length===0){ 
            document.getElementById('result-vibration').innerText=t('vibDenied'); 
            state.sensorResults.vibration="none";
            document.getElementById('block-vibration').classList.add('skipped');
            checkAllMeasured(); 
        } 
    },5000);
}

function skipSensor(type) {
    const deniedText = { camera: t('cameraDenied'), microphone: t('micDenied'), vibration: t('vibDenied') }[type];
    document.getElementById('result-' + type).innerText = deniedText;
    state.sensorResults[type] = "none";
    document.getElementById('block-' + type).classList.add('skipped');
    checkAllMeasured();
}

function checkAllMeasured() {
    document.getElementById('btnFinal').style.display = 'block';
}

function showFinalResult() {
    const deviceId = document.getElementById('currentDeviceLabel').textContent;
    const deviceName = Object.keys(FAULTS).find(key => getDeviceName(key) === deviceId) || deviceId;
    const { camera, microphone, vibration } = state.sensorResults;

    const measuredCount = [camera, microphone, vibration].filter(v => v && v !== "none").length;

    if (measuredCount === 0) {
        document.getElementById('verdictIcon').textContent = "⚪";
        document.getElementById('finalText').textContent = t('noMeasure');
        document.getElementById('finalSolution').textContent = "";
        document.getElementById('finalResult').style.display = 'block';
        return;
    }

    // لا يمكن لكاميرا أو ميكروفون أو حساس اهتزاز الهاتف "شمّ" الغاز فعلياً؛
    // مطابقة رائحة الغاز بصوت أو صورة هي وهم فيزيائي وليست قياساً حقيقياً.
    // لذلك نستبعد هذه الأعطال من التقييم الآلي ونعرضها كتنبيه ثابت مستقل.
    const NON_SENSABLE_KEYWORD = "رائحة غاز";
    const sensableFaults = (FAULTS[deviceName] || []).filter(f => !f.name.includes(NON_SENSABLE_KEYWORD));

    // الثقة = عدد الحساسات المقاسة التي تطابقت مع توقيع العطل، مقسومة على
    // عدد الحساسات التي قاسها المستخدم فعلاً — بدل تجاهل أي مطابقة جزئية
    // والحكم بـ"لا يوجد عطل" كما كان يحدث سابقاً عندما لا تتوفر كل الحساسات.
    let bestMatch = null, bestScore = -1, bestConfidence = 0;
    sensableFaults.forEach(fault => {
        let score = 0;
        if (fault.signals.sound === microphone && microphone !== "none") score += 1;
        if (fault.signals.image === camera && camera !== "none") score += 1;
        if (fault.signals.vibration === vibration && vibration !== "none") score += 1;
        if (score > bestScore) { bestScore = score; bestMatch = fault; bestConfidence = score / measuredCount; }
    });

    if (bestMatch && bestScore > 0) {
        let icon = bestMatch.severity === "خطر" ? "🔴" : (bestMatch.severity === "متوسط" ? "🟡" : "🟢");
        document.getElementById('verdictIcon').textContent = icon;
        document.getElementById('finalText').textContent = getFaultText(bestMatch, 'name');
        let solutionText = `${t('solutionLabel')}: ${getFaultText(bestMatch, 'solution')}`;
        if (bestConfidence < 1) {
            solutionText += ` — ${t('confidenceLabel')}: ${Math.round(bestConfidence * 100)}%`;
        }
        document.getElementById('finalSolution').textContent = solutionText;
    } else {
        document.getElementById('verdictIcon').textContent = "⚪";
        document.getElementById('finalText').textContent = t('noFault');
        document.getElementById('finalSolution').textContent = "";
    }

    const noteEl = document.getElementById('gasSafetyNote');
    if (deviceName === 'بوتاجاز' || deviceName === 'سخان غاز') {
        noteEl.textContent = t('gasSafetyNote');
        noteEl.style.display = 'block';
    } else {
        noteEl.style.display = 'none';
    }

    document.getElementById('finalResult').style.display = 'block';
}

function showToast(msg) {
    let el = document.createElement('div');
    el.style.cssText = "position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1e293b;border:2px solid #f5b81b;color:#fff;padding:8px 18px;border-radius:20px;font-size:0.75rem;z-index:1000;max-width:85%;text-align:center;white-space:normal;line-height:1.5;";
    el.textContent = msg;
    document.body.appendChild(el);
    const duration = Math.min(6000, Math.max(2500, msg.length * 60));
    setTimeout(() => el.remove(), duration);
}

function copyLink() { navigator.clipboard.writeText(window.location.href); showToast("📋 " + t('copy')); }
function rate(n) {
    document.querySelectorAll('#starsDisplay span').forEach((s, i) => s.style.color = i < n ? '#f5b81b' : '#475569');
    // ملاحظة: يُحفظ التقييم محلياً على هذا الجهاز فقط. لا يوجد خادم يجمع
    // التقييمات من كل المستخدمين — إضافة ذلك يتطلب بنية خلفية (backend)
    // حقيقية وهو خارج نطاق هذا الملف الثابت وحده.
    localStorage.setItem('userRating', n);
    showToast("⭐ " + n + "/5");
}

function restoreRating() {
    const saved = parseInt(localStorage.getItem('userRating'), 10);
    if (saved) document.querySelectorAll('#starsDisplay span').forEach((s, i) => s.style.color = i < saved ? '#f5b81b' : '#475569');
}

const SPEECH_LOCALES = { ar:'ar-SA', en:'en-US', fr:'fr-FR', de:'de-DE', es:'es-ES', it:'it-IT', pt:'pt-PT', ru:'ru-RU', zh:'zh-CN', ja:'ja-JP', ko:'ko-KR', hi:'hi-IN', tr:'tr-TR', id:'id-ID', ms:'ms-MY', vi:'vi-VN', th:'th-TH', nl:'nl-NL', pl:'pl-PL', sv:'sv-SE', fa:'fa-IR', ur:'ur-PK', sw:'sw-KE' };

function getFullResultText() {
    const name = document.getElementById('finalText').textContent;
    const solution = document.getElementById('finalSolution').textContent;
    return solution ? `${name}\n${solution}` : name;
}

function speakFinal() {
    const u = new SpeechSynthesisUtterance(getFullResultText());
    u.lang = SPEECH_LOCALES[currentLang] || 'en-US'; // كانت مقصورة على العربية/الإنجليزية فقط سابقاً
    window.speechSynthesis.speak(u);
}

function copyFinal() {
    navigator.clipboard.writeText(getFullResultText());
    showToast("📋 " + t('copy'));
}

function shareFinal() {
    const text = getFullResultText();
    if (navigator.share) navigator.share({ text });
    else navigator.clipboard.writeText(text);
}
