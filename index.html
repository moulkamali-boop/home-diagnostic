    async function startMicOnly() {
        const liveArea = document.getElementById("liveArea");
        liveArea.innerHTML = `<div id="micContainer"><canvas id="micCanvas" width="100%" height="80" style="background:#000; border-radius:12px;"></canvas></div>`;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStreams.mic = stream;
            const audioCtx = new AudioContext();
            await audioCtx.resume();
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            const canvas = document.getElementById("micCanvas");
            canvas.width = canvas.clientWidth; canvas.height = 80;
            const ctx = canvas.getContext("2d");
            function draw() {
                if (!mediaStreams.mic) return;
                analyser.getByteFrequencyData(dataArray);
                let avg = 0;
                for (let i=0; i<dataArray.length; i++) avg += dataArray[i];
                avg /= dataArray.length;
                const level = avg / 255;
                analysisData.micDesc = level > 0.6 ? t("micAbnormal") : t("micNormal");
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "#f5b81b";
                ctx.fillRect(0, canvas.height - level * canvas.height, canvas.width, level * canvas.height);
                requestAnimationFrame(draw);
            }
            draw();
            document.getElementById("sensorMic").classList.add("active");
            showToast("✅ الميكروفون يعمل");
        } catch(e) { liveArea.innerHTML = `<div>❌ ${t("micDisabled")}</div>`; analysisData.micDesc = "❌ " + t("micDisabled"); }
    }
    
    function startVibOnly() {
        if (!window.DeviceMotionEvent) { showToast("الاهتزاز غير مدعوم"); return; }
        const liveArea = document.getElementById("liveArea");
        liveArea.innerHTML = `<div id="vibContainer"><canvas id="vibCanvas" width="100%" height="80" style="background:#000; border-radius:12px;"></canvas></div>`;
        const canvas = document.getElementById("vibCanvas");
        canvas.width = canvas.clientWidth; canvas.height = 80;
        const ctx = canvas.getContext("2d");
        let intensities = [];
        const handler = (e) => {
            const acc = e.accelerationIncludingGravity;
            if (acc) {
                let inten = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
                inten = Math.min(1, inten / 35);
                intensities.push(inten);
                if (intensities.length > 20) intensities.shift();
                const avg = intensities.reduce((a,b)=>a+b,0) / intensities.length;
                analysisData.vibIntensity = avg;
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "#f59e0b";
                ctx.fillRect(0, canvas.height - avg * canvas.height, canvas.width, avg * canvas.height);
                ctx.fillStyle = "#fff";
                ctx.fillText(`${t("vib")}: ${(avg*100).toFixed(0)}%`, 5, 15);
            }
        };
        window.addEventListener("devicemotion", handler);
        vibHandler = handler;
        document.getElementById("sensorVib").classList.add("active");
        showToast("✅ الاهتزاز يعمل");
    }

    // ------------------------ التشخيص الذكي (دورة 4 حساسات) ------------------------
    async function runSmartDiagnosis() {
        if (!currentDevice) { showToast(t("selectDevice")); return; }
        if (!adminMode && currentCredits <= 0) { showToast(t("noCredits")); return; }
        if (diagnosisInProgress) { showToast("التشخيص قيد التنفيذ"); return; }
        diagnosisInProgress = true;
        // إيقاف أي حساس عادي
        stopAllNormalSensors();
        // إعادة تهيئة منطقة العرض
        const liveDiv = document.getElementById("liveArea");
        liveDiv.innerHTML = `<div id="dynamicSensorArea"></div><div class="progress-bar"><div class="progress-fill" id="smartProgress"></div></div><div class="smart-timer" id="smartTimerLabel"></div>`;
        const progressFill = document.getElementById("smartProgress");
        const timerLabel = document.getElementById("smartTimerLabel");
        
        const steps = [
            { name: 'camera', display: t("smart_camera"), duration: 15, start: startCameraOnly, stop: () => { if(mediaStreams.cam) { mediaStreams.cam.getTracks().forEach(t=>t.stop()); mediaStreams.cam=null; } } },
            { name: 'mic', display: t("smart_mic"), duration: 15, start: startMicOnly, stop: () => { if(mediaStreams.mic) { mediaStreams.mic.getTracks().forEach(t=>t.stop()); mediaStreams.mic=null; } } },
            { name: 'vib', display: t("smart_vib"), duration: 15, start: startVibOnly, stop: () => { if(vibHandler) { window.removeEventListener("devicemotion", vibHandler); vibHandler=null; } } },
            { name: 'temp', display: t("smart_temp"), duration: 15, start: startTempOnly, stop: () => { document.getElementById("tempSliderArea").style.display = "none"; } }
        ];
        
        let stepIndex = 0;
        let timeRemaining = steps[0].duration;
        let stepInterval;
        
        function updateProgress() {
            const total = steps.reduce((s,step)=> s+step.duration, 0);
            let elapsed = 0;
            for (let i=0; i<stepIndex; i++) elapsed += steps[i].duration;
            elapsed += (steps[stepIndex].duration - timeRemaining);
            const percent = (elapsed / total) * 100;
            if (progressFill) progressFill.style.width = percent + "%";
            timerLabel.innerText = `⏳ ${steps[stepIndex].display}: ${timeRemaining} ${t("secondsLeft")}`;
        }
        
        async function runStep() {
            if (stepIndex >= steps.length) {
                clearInterval(stepInterval);
                // جمع النتائج
                const sensorData = {
                    camera: analysisData.cameraDesc,
                    microphone: analysisData.micDesc,
                    vibration: analysisData.vibIntensity,
                    temperature: analysisData.tempValue
                };
                let finalDiag;
                if (adminMode) {
                    finalDiag = `🧠 ${t("smartDiag")} (مدير):\n📷 ${sensorData.camera}\n🎤 ${sensorData.microphone}\n📳 اهتزاز: ${(sensorData.vibration*100).toFixed(0)}%\n🌡️ حرارة: ${sensorData.temperature}°C\n🔧 ${t("recommendationNormal")}`;
                    currentDiagnosisText = finalDiag;
                    document.getElementById("reportBox").innerHTML = finalDiag.replace(/\n/g,"<br>");
                    saveToHistory(finalDiag);
                } else {
                    const diag = await useDiagnosis(sensorData, "smart cycle");
                    if (diag) { currentDiagnosisText = diag; document.getElementById("reportBox").innerHTML = diag; saveToHistory(diag); }
                }
                diagnosisInProgress = false;
                stopAllNormalSensors();
                liveDiv.innerHTML = `<div style="padding:12px;">🔌 ${t("diagReady")}</div>`;
                showToast("✅ اكتمل التشخيص الذكي");
                return;
            }
            const step = steps[stepIndex];
            // أوقف أي حساس سابق
            if (stepIndex > 0) steps[stepIndex-1].stop();
            // قم بتشغيل الحساس الحالي
            await step.start();
            timeRemaining = step.duration;
            updateProgress();
            // عداد تنازلي
            const countdown = setInterval(() => {
                if (!diagnosisInProgress) { clearInterval(countdown); return; }
                timeRemaining--;
                updateProgress();
                if (timeRemaining <= 0) {
                    clearInterval(countdown);
                    stepIndex++;
                    runStep();
                }
            }, 1000);
            stepInterval = countdown;
        }
        
        await runStep();
        
        // مهلة عامة للإلغاء
        smartTimerInterval = setInterval(() => {}, 1000); // مجرد مرجع
    }

    function speakDiagnosisResult() { if(!currentDiagnosisText){ showToast(t("noSummary")); return; } window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(currentDiagnosisText); utterance.lang = currentLang==='ar'?'ar-SA':'en-US'; utterance.rate=0.9; window.speechSynthesis.speak(utterance); }
    function startSpeechInput() { if(!('webkitSpeechRecognition' in window)){ showToast("Not supported"); return; } let rec = new webkitSpeechRecognition(); rec.lang = currentLang==='ar'?'ar-SA':'en-US'; rec.start(); rec.onresult=e=>{ let text=e.results[0][0].transcript; document.getElementById("reportBox").innerHTML += `<br>🎤 ${t("user")} ${text}`; showToast(t("voiceAdded")); }; }
    function setRating(val) { let stars = document.querySelectorAll("#ratingStars span"); stars.forEach((s,i)=>{ if(i<val) s.classList.add("active"); else s.classList.remove("active"); }); let msgs = currentLang==='ar'?["","سيء","مقبول","جيد","ممتاز","احترافي"]:["","Poor","Acceptable","Good","Excellent","Professional"]; document.getElementById("ratingMsg").innerHTML = `⭐ ${msgs[val]||''}`; }
    function selectDevice(devId, devName) { if(!adminMode && currentCredits<=0) { showToast(t("noCredits")); return; } currentDevice=devId; currentDeviceName=devName; document.getElementById("deviceList").style.display="none"; document.getElementById("labPanel").style.display="block"; document.getElementById("deviceNameLabel").innerText=devName; document.getElementById("reportBox").innerHTML = `🔧 ${devName}<br>🔍 ${t("waiting")}`; currentDiagnosisText=""; if(smartTimerInterval) clearInterval(smartTimerInterval); diagnosisInProgress=false; stopAllNormalSensors(); document.getElementById("liveArea").innerHTML = `<div style="padding:12px;">🔌 ${t("waiting")}</div>`; }
    function closeLab() { if(smartTimerInterval) clearInterval(smartTimerInterval); diagnosisInProgress=false; stopAllNormalSensors(); document.getElementById("deviceList").style.display="block"; document.getElementById("labPanel").style.display="none"; currentDevice=null; }
    
    // بناء قائمة اللغات
    function buildLangSelect() {
        let sel = document.getElementById("langSelect");
        sel.innerHTML = "";
        for (let code in langList) {
            let opt = document.createElement("option");
            opt.value = code;
            opt.textContent = langList[code];
            if (code === currentLang) opt.selected = true;
            sel.appendChild(opt);
        }
        sel.onchange = (e) => changeLanguage(e.target.value);
    }
    
    // تهيئة التطبيق
    async function init() {
        setInterval(()=>{ let d=new Date(); document.getElementById("currentDate").innerText=d.toLocaleDateString(); document.getElementById("currentTime").innerText=d.toLocaleTimeString(); },1000);
        if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>document.getElementById("locationText").innerText=`${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`,()=>document.getElementById("locationText").innerText="❌");
        new QRCode(document.getElementById("qrCodeContainer"), window.location.href);
        let savedLang = localStorage.getItem("home_lang");
        if (savedLang && langList[savedLang]) currentLang = savedLang;
        buildLangSelect();
        await fetchCredits();
        await processPaymentReturn();
        updateUI();
        let adminStored = localStorage.getItem("home_admin"); if (adminStored === "true") adminMode = true;
    }
    init();
    document.getElementById("secretIcon").onclick = triggerAdmin;
</script>
</body>
</html>
